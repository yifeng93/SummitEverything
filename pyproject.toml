[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "summit-everything"
version = "0.1.0"
description = "Personal work knowledge application — contract foundation"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "keyring>=25,<26; sys_platform == 'darwin'",
    "pydantic>=2.9,<3",
    "python-multipart>=0.0.32",
    "pyyaml>=6,<7",
    "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.9,<1",
    "mypy>=1.10,<2",
    "types-pyyaml>=6,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/summit_everything"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
